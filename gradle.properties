# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (default in AGP 9.0)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Enable AGP 9.0 features
android.newDsl=true
android.builtInKotlin=true

# Performance improvements for project sync
android.dependency.excludeLibraryComponentsFromConstraints=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# The following deprecated properties have been removed to adopt the new AGP 9.0 defaults:
# - android.usesSdkInManifest.disallowed (now true)
# - android.sdk.defaultTargetSdkToCompileSdkIfUnset (now true)
# - android.enableAppCompileTimeRClass (now true)
# - android.r8.optimizedResourceShrinking (now true)
# - android.defaults.buildfeatures.resvalues (now false)
# - android.uniquePackageNames (now true)
